      secondaryTextColor: "#b0b3b8"
      textLinkColor: "#ffffff"
      backgroundColor: "#111827"
      secondaryBackgroundColor: "#1F2937"
      primaryColor: "#ffffff"
      secondaryColor: "#212529"

