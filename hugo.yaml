  # projects
  projects:
    enable: true
    # title: "Custom Name"
    items:
      - title: PCB Microsection Measurement System
        content: A deep learning–based microscopic measurement framework to make measurements more consistent and automated.
        image: /images/projects/proj-pcb-measurement.jpg
        # featured:
        #   name: Demo
        #   link: https://hugo-profile.netlify.app
        badges:
          - "YOLOv8"
          - "CNN"
          - "RabbitMQ"
          - "Celery"
        modalId: "proj-pcb-measurement"
        modalImages:
          - /images/projects/proj-pcb-measurement.jpg
          - /images/projects/proj-pcb-measurement-2.png
        details: |- 
            Microscopic cross-section measurement is used to measure the width of PCB components, but it’s often done by manual visual inspection, which can lead to inconsistent standards and measurement errors. To solve this, we built a deep learning–based microscopic measurement framework to make measurements more consistent and automated.
            
            The pipeline first uses YOLOv4 to extract the region of interest (ROI) and reduce surrounding noise. Then, CNN models (trained for four different data categories) predict the required coordinate points, and we evaluate performance using RMSE. To make the system scalable and reliable in production, we integrated RabbitMQ + Celery to handle asynchronous job queuing and distributed inference.
            
            In experiments, RMSE was < 2 on the Undercut and Pad datasets, < 3 on Substrate, and < 6 on Copper, helping reduce manual inspection cost and improve PCB quality.

      - title: Metric Learning–based PCB SMT Component Detection Framework
        content: A Metric Learning-based Incorrect Component Detection (MICD) framework that identifies SMT defects by comparing visual feature similarity instead of relying on traditional OCR.
        image: /images/projects/proj-micd-1.png
        # featured:
        #   name: Demo
        #   link: https://django-converter.herokuapp.com
        badges:
          - "Metric-Learning"
        modalId: "proj-pcb-smt"
        modalImages:
          - /images/projects/proj-micd-1.png
        # - /images/projects/proj-micd-2.png
        details: |- 
          # Overview
          This research collaboration with an SMT (Surface Mount Technology) company addressed a critical industrial challenge. Traditional OCR (Optical Character Recognition) often fails in factory environments due to dust and motion blur, leading to high false alarm rates. I developed the **MICD framework**, which utilizes Metric Learning to compare components against a "Golden Sample" rather than relying on text recognition, effectively reducing false alarms by up to 90%.

          # Problem
          In SMT production lines, factories rely on OCR to verify component serial numbers. However, OCR struggles when images are blurry, dusty, or obscured—conditions common in real-world manufacturing. This results in excessive false alarms and necessitates costly manual inspections.

          # Solutions
          To solve this, I developed the **MICD framework**. Instead of "reading" text, the system focuses on **feature similarity learning** through three main stages:
          
          * **Preprocessing**: Applied grayscale conversion and sharpening to enhance image clarity.
          * **Feature Extraction**: Leveraged **Prototypical and Relation Networks** (with a **DenseNet** backbone) to extract robust visual features.
          * **Comparison**: A "**Golden Sample**" (the ideal reference image) is compared to the target component using **Cosine Similarity**. If the similarity score falls below a threshold, it is flagged.

          # Impact
          The results demonstrated a significant improvement over standard methods like Google Cloud OCR:
          
          * **90% Reduction in False Alarms**: Dramatically decreased errors in dusty conditions compared to traditional OCR.
          * **54% Improvement in Blurry Conditions**: Significantly more robust performance under focus-related issues.
          * **Explainability**: Implemented **Grad-CAM** to generate heatmaps, visually confirming that the model focuses on critical component features rather than background noise.




