  # projects
  projects:
    enable: true
    # title: "Custom Name"
    items:
    - title: Distributed Real-Time AML Transaction Alert System
      content: An asynchronous transaction alert system with explainable predictions, audit records, and resilient
        message processing. Reduced automated alert turnaround from 2 hours to 2 minutes.
      image: /images/projects/proj-aml-1.png
      badges:
      - FastAPI
      - RabbitMQ
      - Celery
      - PostgreSQL
      - SHAP
      modalId: proj-aml
      modalImages:
      - /images/projects/proj-aml-1.png
      links:
      - icon: fas fa-file-alt
        name: IEEE ICCE-TW 2024
        url: https://doi.org/10.1109/ICCE-Taiwan62264.2024.10674363
      details: |-
        ## From transactions to explainable alerts

        FastAPI ingests transactions into RabbitMQ. Dockerized Celery workers run DNN inference and SHAP explanations, storing predictions and audit records in PostgreSQL. Low-confidence cases go to human review.

        ## Engineering & results

        - Handles 200 concurrent API requests
        - Reduces automated alert turnaround from 2 hours to 2 minutes
        - Idempotent processing, retries, and dead-letter queues handle failures
        - Prometheus/Grafana monitor queue depth; pytest integration tests validate workflows

        Published at IEEE ICCE-TW 2024.
    - title: Few-Shot SMT Component Inspection System
      content: A few-shot visual inspection service that detects unseen components without retraining. Reduced
        false alarms by 90% versus Google Cloud OCR and brought p99 latency below 100 ms.
      image: /images/projects/proj-micd-1.png
      badges:
      - FastAPI
      - PyTorch
      - NVIDIA Triton
      - Redis
      - PostgreSQL
      modalId: proj-pcb-smt
      modalImages:
      - /images/projects/proj-micd-1.png
      links:
      - icon: fas fa-file-alt
        name: IEEE CAI 2025
        url: https://doi.org/10.1109/CAI64502.2025.00010
      details: |-
        ## Visual similarity instead of text recognition

        A FastAPI inspection service serves EfficientNet embeddings through NVIDIA Triton, caches prototypes in Redis, and stores inspection results in PostgreSQL.

        ## Engineering & results

        - 5-shot prototypical and relation networks detect unseen components using golden samples without model retraining
        - Reduces false alarms by 90% versus Google Cloud OCR
        - Reduces p99 latency from 420 ms to under 100 ms while sustaining 60 components/min
        - Grad-CAM explanations and confidence-based human review maintain a defect escape rate under 7%

        Published at IEEE CAI 2025.
    - title: PCB Microsection Measurement System
      content: Automates PCB microsection measurements with YOLOv5 region detection and CNN regression, cutting manual inspection time by 90% and measurement errors by 95%.
      image: /images/projects/proj-pcb-measurement-3.png
      badges:
      - YOLOv5
      - CNN
      - FastAPI
      - Redis
      - RQ
      modalId: proj-pcb-measurement
      modalImages:
      - /images/projects/proj-pcb-measurement-3.png
      details: |-
        ## Overview

        An automated PCB microsection measurement system combining computer vision, deep learning, and async backend processing to replace manual inspection. YOLOv5 detects measurement regions and a CNN regression model estimates measurements; a FastAPI + Redis/RQ pipeline processes jobs asynchronously.

        ## Key Results

        - Reduced manual inspection time by 90% and measurement errors by 95%
        - Tech stack: FastAPI, YOLOv5, CNN, PyTorch, Redis, RQ, MySQL, Docker
    - title: Spatio-Temporal Vision System for SOP Compliance and Defect Detection
      content: Combines YOLOv8-seg and LSTM to check assembly steps and detect residue in real time, contributing to a 15% production-yield increase.
      image: /images/projects/proj-st-scd-1.png
      badges:
      - YOLOv8
      - LSTM
      - Docker
      modalId: proj-st-scd
      modalImages:
      - /images/projects/proj-st-scd-1.png
      details: |-
        ## Overview

        An AI vision system monitoring manual assembly lines: YOLOv8-seg for spatial perception and an LSTM over a 60-frame window for temporal reasoning, with a finite state machine triggering alerts for out-of-order actions or leftover film residue.

        ## Key Results

        - Production yield up 15% by eliminating human-error-related defects
        - Tech stack: YOLOv8-seg, PyTorch (LSTM), TensorRT, OpenCV, Docker, MQTT

