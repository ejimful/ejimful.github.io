    secondaryTextColor: "#6B7280"
    textLinkColor: "#111827"
    backgroundColor: "#FFFFFF"
    secondaryBackgroundColor: "#F8F9FA"
    primaryColor: "#111827"
    secondaryColor: "#E5E7EB"

