    enable: true
    # title: "Custom Name"
    items:
      - title: PCB Microsection Measurement System
        content: A deep learning–based microscopic measurement framework to make measurements more consistent and automated.
        image: /images/projects/proj-pcb-measurement-3.png
        # featured:
        #   name: Demo
        #   link: https://hugo-profile.netlify.app
        badges:
          - "YOLOv5"
          - "CNN"
          - "RabbitMQ"
          - "Celery"
        modalId: "proj-pcb-measurement"
        modalImages:
          - /images/projects/proj-pcb-measurement-3.png
          - /images/projects/proj-pcb-measurement-1.png
          - /images/projects/proj-pcb-measurement-2.png
        details: |- 
            ## Overview

            An automated **PCB Microsection Measurement System** that combines computer vision, deep learning, and asynchronous backend processing to replace manual inspection workflows.

            The system uses **YOLOv5** to detect measurement regions of interest (ROIs) and a **CNN regression model** to estimate PCB measurements automatically. A distributed inference pipeline built with **FastAPI, Redis, and RQ workers** enables multiple inspection jobs to be processed asynchronously and reliably.

            The system reduced **manual inspection time by 90%** and **measurement errors by 95%**.

            ---

            ## Problem

            PCB microsection inspection traditionally requires engineers to manually identify measurement regions and measure features from microscope images. This process is repetitive, time-consuming, and prone to human inconsistency.

            Several challenges make automation difficult:

            - Measurement regions can appear at different positions and scales across PCB images.
            - Raw microscope images contain irrelevant background areas that can interfere with measurement models.
            - Manual measurements may vary between operators.
            - Running computer vision models directly inside API requests can cause long response times and poor scalability when multiple inspection jobs arrive simultaneously.

            The goal of this project was to build an automated system that could reliably identify measurement regions, estimate measurements, and process multiple inspection requests without blocking the application.

            ---

            ## System Architecture
            The system follows an **asynchronous inference architecture** designed to separate API requests from computationally expensive model processing.

            - **API Layer — FastAPI**  
              Receives PCB microsection images and creates measurement jobs for asynchronous processing.

            - **Task Queue — Redis + RQ**  
              Decouples incoming requests from model inference, allowing multiple jobs to be processed without blocking the API.

            - **ML Inference Pipeline — YOLOv5 + CNN**  
              YOLOv5 detects the target measurement region, and a CNN regression model estimates the final PCB measurement from the detected ROI.

            - **Worker Layer — RQ Workers**  
              Processes queued inference jobs in parallel and supports retrying failed tasks.

            - **Data Layer — MySQL**  
              Stores job status and measurement results for tracking and retrieval.

            The overall flow is:

            ```text
            PCB Image
              ↓
            FastAPI
              ↓
            Redis / RQ
              ↓
            RQ Workers
              ↓
            YOLOv5 + CNN
              ↓
            MySQL
              ↓
            Measurement Result
            ```

            ---

            ## Tech Stack

            - **Backend:** FastAPI
            - **Machine Learning:** YOLOv5, CNN Regression, PyTorch
            - **Computer Vision:** OpenCV
            - **Asynchronous Processing:** Redis, RQ
            - **Database:** MySQL
            - **Data Processing:** Python, NumPy
            - **Deployment:** Docker

            ---

            ## Challenges

            One of the main challenges was building a reliable measurement pipeline from microscope images where the target region could appear at different positions, scales, and visual conditions.

            Another challenge was integrating computationally expensive model inference into a backend service without blocking incoming API requests.

            The system also needed to handle inference failures gracefully while maintaining accurate job status and measurement records.

            ---

            ## Solutions

            I implemented a **two-stage computer vision pipeline** where YOLOv5 first identifies the measurement region and a CNN regression model performs measurement inference only on the detected ROI.

            This reduces irrelevant visual information and allows the regression model to focus on the target PCB structure.

            To prevent model inference from blocking API requests, I built an **asynchronous processing architecture using FastAPI, Redis, and RQ workers**, allowing multiple inspection jobs to run in parallel.

            I also implemented **automatic retries and MySQL-based job tracking** to improve reliability and maintain a complete record of each measurement request.

            Together, these improvements reduced **manual inspection time by 90%** and **measurement errors by 95%**.

            ---

            ## Key Results

            - Reduced manual PCB inspection time by **90%**
            - Reduced measurement errors by **95%**
            - Built an asynchronous inference pipeline using **FastAPI, Redis, and RQ**
            - Combined **YOLOv5 ROI detection + CNN regression** for automated PCB measurement

      - title: Metric Learning–based PCB SMT Component Detection Framework
        content: A Metric Learning-based Incorrect Component Detection (MICD) framework that identifies SMT defects by comparing visual feature similarity instead of relying on traditional OCR.
        image: /images/projects/proj-micd-1.png
        # featured:
        #   name: Demo
        #   link: https://django-converter.herokuapp.com
        badges:
          - "Metric-Learning"
        modalId: "proj-pcb-smt"
        modalImages:
          - /images/projects/proj-micd-1.png
        # - /images/projects/proj-micd-2.png
        details: |- 
          ## Overview
          This research collaboration with an SMT (Surface Mount Technology) company addressed a critical industrial challenge. Traditional OCR (Optical Character Recognition) often fails in factory environments due to dust and motion blur, leading to high false alarm rates. I developed the **MICD framework**, which utilizes Metric Learning to compare components against a "Golden Sample" rather than relying on text recognition, effectively reducing false alarms by up to 90%.
          
          ---

          ## Problem
          In SMT production lines, factories rely on OCR to verify component serial numbers. However, OCR struggles when images are blurry, dusty, or obscured—conditions common in real-world manufacturing. This results in excessive false alarms and necessitates costly manual inspections.
          
          ---

          ## Solutions
          To solve this, I developed the **MICD framework**. Instead of "reading" text, the system focuses on **feature similarity learning** through three main stages:
          
          * **Preprocessing**: Applied grayscale conversion and sharpening to enhance image clarity.
          * **Feature Extraction**: Leveraged **Prototypical and Relation Networks** (with a **DenseNet** backbone) to extract robust visual features.
          * **Comparison**: A "**Golden Sample**" (the ideal reference image) is compared to the target component using **Cosine Similarity**. If the similarity score falls below a threshold, it is flagged.
          
          ---

          ## Impact
          The results demonstrated a significant improvement over standard methods like Google Cloud OCR:
          
          * **90% Reduction in False Alarms**: Dramatically decreased errors in dusty conditions compared to traditional OCR.
          * **54% Improvement in Blurry Conditions**: Significantly more robust performance under focus-related issues.
          * **Explainability**: Implemented **Grad-CAM** to generate heatmaps, visually confirming that the model focuses on critical component features rather than background noise.

      - title: Spatio-Temporal Vision System for SOP Compliance and Defect Detection
        content: The system ensures operators strictly follow SOP while simultaneously detecting film residues on the board surface.
        image: /images/projects/proj-st-scd-1.png
        # featured:
        #   name: Demo V2
        #   link: https://hugo-profile-2.netlify.app
        badges:
          - YOLOv8
          - LSTM
          - Docker  
        modalId: "proj-st-scd"
        modalImages:
          - /images/projects/proj-st-scd-1.png
        details: |-
            ## Overview
            Development of an AI-driven vision system to monitor manual assembly lines. The system ensures operators strictly follow Standard Operating Procedures (SOP)—specifically a Pick-Peel-Flip-Peel sequence—while simultaneously detecting microscopic film residues on the board surface.

            ## Problem
            Manual peeling of protective films is prone to human error, such as skipping the flip-side peeling or leaving residual fragments, leading to downstream assembly failures and reduced throughput.

            ## System Architecture
            The system employs a **Two-Stage Spatio-Temporal Pipeline**:
            * **Stage 1 (Spatial Perception):** A **YOLOv8-seg** model performs real-time instance segmentation to identify the board (PCBA), the operator’s hands, and any film residues.
            * **Stage 2 (Temporal Reasoning):** A **Many-to-One LSTM** network processes the sequence of coordinated data (bounding box coordinates, hand trajectories, and residue area) over a sliding window of 60 frames to classify the current action state.
            * **Logic Controller:** A Finite State Machine (FSM) triggers alerts if the LSTM detects an out-of-order action or if YOLOv8 detects residue after a "peel" action is completed.

            ## Impact
            Yield Improvement: Achieved a 15% increase in product yield by eliminating human-error-related defects.

            ## Tech Stack
            * **Vision:** YOLOv8-segmentation (Ultralytics)
            * **Sequence Modeling:** PyTorch (LSTM / GRU)
            * **Deployment:** NVIDIA TensorRT, OpenCV
            * **Infrastructure:** Python, Docker, MQTT (for factory floor alerts)

      
      - title: Real-time Transaction Alert System
        content: A real-time Anti-Money Laundering (AML) detection system integrating DNN and XAI.
        image: /images/projects/proj-aml-1.png
        badges:
          - Python
          - RabbitMQ
          - Celery
          - XAI 
        modalId: "proj-aml"
        modalImages:
          - /images/projects/proj-aml-1.png
        details: |-
            ## Overview
            A real-time Anti-Money Laundering (AML) detection system integrating Deep Neural Networks (DNN) and Explainable AI (XAI). The project implements a distributed backend architecture to ensure low-latency preprocessing and transparent decision analysis in high-concurrency environments. This system achieving 97% accuracy and 90% faster detection time.

            ## Problem
            Traditional AML processes rely heavily on manual review, which is time-consuming and expensive. Additionally, deep learning models are often seen as "black boxes" , and severe data imbalance in financial datasets makes it difficult for models to accurately detect rare abnormal transactions.

            ## System Architecture
            To handle high-volume financial data without performance lag, I designed a decoupled, microservices-oriented architecture. Here is how the data flows through the system:
            * **Decoupled Entry Point (FastAPI + RabbitMQ)** <br>
            When a transaction occurs, FastAPI ingests the raw data and immediately offloads it to RabbitMQ. This asynchronous "waiting room" ensures the front-end remains responsive even during sudden traffic spikes, preventing system crashes.
            * **Scalable Processing (Dockerized Celery Workers)** <br>
            Multiple Celery Workers—isolated in Docker containers—run in parallel to pull tasks from the queue. They handle the complex preprocessing and feature engineering, which allowed us to cut end-to-end latency by 90%.
            * **Intelligent Inference & XAI (DNN + SHAP)** <br>
            Once the data is cleaned, it is processed by a Deep Neural Network (DNN) optimized for high recall. If a transaction is flagged as suspicious, the system automatically triggers the SHAP engine to provide a transparent, feature-level explanation for the alert.
            * **Audit-Ready Storage (PostgreSQL)** <br>
            The final results—including the transaction details, the model’s prediction, and the SHAP interpretability report—are logged into PostgreSQL. This creates a comprehensive audit trail for the bank’s compliance and legal teams.

            ## Tech Stack
            * **Machine Learning:** DNN (Deep Neural Network), Scikit-learn
            * **XAI Tools:** SHAP
            * **Data Processing:** Python (Pandas/NumPy), SMOTE (for data augmentation)
            * **Distributed Systems:** RabbitMQ, Celery, Docker

            ## Challenges 
            Ensuring consistency of preprocessing logic across distributed nodes under millisecond-level latency requirements, and overcoming training difficulties caused by extremely sparse money-laundering data.

            ## Solutions
            Implemented SMOTE to balance the dataset by oversampling the minority class. Built an asynchronous parallel pipeline using RabbitMQ and Celery. Leveraged SHAP to identify "Payment Format" as the most critical feature, providing the transparency required for regulatory compliance.

            ## Imapact
            The DNN model achieved a recall of 0.94 and 97% accuracy. The distributed architecture improved end-to-end detection speed by 90%, significantly optimizing automation efficiency for financial institutions.





