  # projects
  projects:
    enable: true
    # title: "Custom Name"
    items:
      - title: PCB Microsection Measurement System
        content: A deep learning–based microscopic measurement framework to make measurements more consistent and automated.
        image: /images/projects/proj-pcb-measurement.jpg
        # featured:
        #   name: Demo
        #   link: https://hugo-profile.netlify.app
        badges:
          - "YOLOv8"
          - "CNN"
          - "RabbitMQ"
          - "Celery"
        modalId: "proj-pcb-measurement"
        modalImages:
          - /images/projects/proj-pcb-measurement.jpg
          - /images/projects/converter.jpg
        details: |- 
            Microscopic cross-section measurement is used to measure the width of PCB components, but it’s often done by manual visual inspection, which can lead to inconsistent standards and measurement errors. To solve this, we built a deep learning–based microscopic measurement framework to make measurements more consistent and automated.
            
            The pipeline first uses YOLOv4 to extract the region of interest (ROI) and reduce surrounding noise. Then, CNN models (trained for four different data categories) predict the required coordinate points, and we evaluate performance using RMSE. To make the system scalable and reliable in production, we integrated RabbitMQ + Celery to handle asynchronous job queuing and distributed inference.
            
            In experiments, RMSE was < 2 on the Undercut and Pad datasets, < 3 on Substrate, and < 6 on Copper, helping reduce manual inspection cost and improve PCB quality.

